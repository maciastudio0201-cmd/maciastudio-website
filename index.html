// 中文排版：只在词语之间换行，不把词语拆开；最后一行至少保留两个词，避免只剩一两个字
const SEG = (typeof Intl !== 'undefined' && Intl.Segmenter) ? new Intl.Segmenter('zh', {granularity:'word'}) : null;
const CJK = /[\u3400-\u9fff]/;
const KEEP = ['艺术体操','试课时段','体能训练','舞蹈技巧','空翻技巧','舞蹈空翻技巧','芭蕾舞课','舞蹈基本功','训练场','训练营','兴趣班','中级班','高级班','精英班','舞蹈技能','芭蕾','训练包','弹力带','训练用品','专业款','训练款','比赛专业款','普通训练款','需预订','训练场馆','新加坡','运动服','俱乐部','狂欢赛','锦标赛','经典赛','公开赛','邀请赛','国外赛'];
function smartWrap(root){
  if (!SEG || !root) return;
  root.querySelectorAll('p, h1, h2, h3, dd, li, .more, .date, .tile p, .eyebrow').forEach(el => {
    if (el.dataset.sw) return; el.dataset.sw = '1';
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
    const cjkNodes = nodes.filter(n => CJK.test(n.nodeValue));
    cjkNodes.forEach((node, idx) => {
      const segs = [...SEG.segment(node.nodeValue)];
      const isLast = idx === cjkNodes.length - 1;
      // 找出可以换行的位置：词与词之间，且下一段不是标点
      const breaks = [];
      for (let i = 1; i < segs.length; i++) {
        const next = segs[i].segment, prev = segs[i-1].segment;
        if (/^[\s，。、；：！？）》」』,.;:!?)]/.test(next)) continue;
        if (/[（《「『(]$/.test(prev)) continue;
        if (!CJK.test(next[0]) && !CJK.test(prev[prev.length-1])) continue;
        if ((next.length === 1 && CJK.test(next)) || (prev.length === 1 && CJK.test(prev))) continue; // 单个字不单独断开
        if (KEEP.some(w => { const j = segs.slice(0,i).map(x=>x.segment).join(''); const tail = j.slice(-w.length+1); return w.length>1 && tail && (tail + next).startsWith(w.slice(0, tail.length + next.length)) && w.startsWith(tail) && w.slice(tail.length).startsWith(next.slice(0, w.length - tail.length)); })) continue;
        breaks.push(i);
      }
      // 最后一行至少保留最后两个词（标点不算）
      if (isLast) {
        let words = 0, cut = segs.length;
        for (let i = segs.length - 1; i >= 0; i--) { if (segs[i].isWordLike) { words++; if (words === 2) { cut = i; break; } } }
        for (let k = breaks.length - 1; k >= 0; k--) if (breaks[k] > cut) breaks.splice(k, 1);
      }
      if (!breaks.length) return;
      const frag = document.createDocumentFragment(); let last = 0;
      breaks.forEach(b => { frag.append(segs.slice(last, b).map(x=>x.segment).join('')); frag.append(document.createElement('wbr')); last = b; });
      frag.append(segs.slice(last).map(x=>x.segment).join(''));
      node.replaceWith(frag);
    });
    el.classList.add('sw');
  });
}
function setupBanner(){
  clearInterval(bannerTimer); bannerTimer = null;
  const tr = document.getElementById('bTrack'); if (!tr) return;
  const n = tr.children.length; if (n < 2) return;
  const dots = [...document.querySelectorAll('.b-dots button')];
  const cur = () => Math.round(tr.scrollLeft / tr.clientWidth);
  const go = (i) => tr.scrollTo({left: ((i % n) + n) % n * tr.clientWidth, behavior:'smooth'});
  const mark = () => dots.forEach((d,i)=>d.setAttribute('aria-current', String(i===cur())));
  tr.addEventListener('scroll', () => requestAnimationFrame(mark)); mark();
  const start = () => { clearInterval(bannerTimer); bannerTimer = setInterval(() => { if (document.getElementById('bTrack') === tr) go(cur()+1); else clearInterval(bannerTimer); }, 3000); };
  document.querySelector('.b-nav.prev').onclick = () => { go(cur()-1); start(); };
  document.querySelector('.b-nav.next').onclick = () => { go(cur()+1); start(); };
  dots.forEach((d,i) => d.onclick = () => { go(i); start(); });
  tr.addEventListener('pointerdown', () => clearInterval(bannerTimer));
  tr.addEventListener('pointerup', start);
  tr.addEventListener('touchend', start, {passive:true});
  start();
}
